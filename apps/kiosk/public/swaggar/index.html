<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kape sa Likod · Café management</title><link rel="icon" href="/assets/kapelogo.png"><link rel="stylesheet" href="/swaggar/style.css"><script type="module" src="/swaggar/app.js"></script></head>
<body>
<div class="admin-kiosk">
<section id="login-view" class="login-view"><header class="login-brand"><img src="/assets/kapelogo.png" alt="Kape sa Likod"></header><form id="login-form" class="login-card"><h1>Staff sign in</h1><label>Email<input type="email" name="email" autocomplete="username" required maxlength="254"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="128"></label><button class="primary">Sign in</button><p id="login-error" role="alert"></p></form></section>
<div id="workspace" class="workspace" hidden><aside class="sidebar"><a class="brand" href="/swaggar/" aria-label="Management home"><img src="/assets/kapelogo.png" alt="Kape sa Likod"></a><nav aria-label="Management"><button data-page="overview">Overview</button><button data-page="orders">Orders</button><button data-page="products" data-roles="owner manager">Products</button><button data-page="categories" data-roles="owner manager">Categories</button><button data-page="settings">Settings</button><button data-page="accounts" data-roles="owner">Accounts</button><button data-page="audit" data-roles="owner manager">Audit history</button></nav><div class="sidebar-bottom"><span id="identity"></span><button id="logout">Sign out</button></div></aside><main><header class="page-header"><div><h1 id="page-title">Overview</h1></div><span class="service-state" id="service-state">Connecting…</span></header><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main></div>
<div class="dialog-layer" hidden><dialog id="editor" aria-labelledby="editor-title"><form method="dialog" class="dialog-close-form"><button aria-label="Close dialog">×</button></form><div id="editor-content"></div></dialog></div>
</div>
</body></html>
